name: Lemon Empire checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lemon
          POSTGRES_PASSWORD: lemon
          POSTGRES_DB: lemon
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lemon"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://lemon:lemon@127.0.0.1:5432/lemon
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
